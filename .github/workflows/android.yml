name: Android build

# Builds the Android app (debug APK) on every push to a branch other than main,
# on pull requests and on demand, and keeps the APK as a downloadable artifact.
# A signed release bundle (.aab) for Google Play needs the upload keystore as
# repository secrets; see "앱 출시 체크리스트" in PLAN.md.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One build per branch at a time: a new push cancels the run it supersedes.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Release bundle signs (temporary key)
        run: |
          BREAKER_RELEASE_DIR="$RUNNER_TEMP/key" bash scripts/release/android-keystore.sh
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/key/upload.p12"
          export ANDROID_KEYSTORE_PASSWORD="$(cat "$RUNNER_TEMP/key/upload.password")"
          (cd android && ./gradlew bundleRelease --no-daemon -PVERSION_CODE=2 -PVERSION_NAME=check)
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"
      - uses: actions/upload-artifact@v4
        with:
          name: breaker3d-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
