name: Android build

# Builds the Android app (debug APK) on every push to a branch other than main,
# on pull requests and on demand, and keeps the APK as a downloadable artifact.
# A signed release bundle (.aab) for Google Play needs the upload keystore as
# repository secrets; see "앱 출시 체크리스트" in PLAN.md.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: breaker3d-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
